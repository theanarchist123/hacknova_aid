  # SOS Emergency Beacon dependencies
  camera: ^0.10.5+9
  audioplayers: ^6.0.0
  screen_brightness: ^0.2.2+1
  wakelock_plus: ^1.2.8
  vibration: ^2.0.0
  battery_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
    - assets/sounds/
    - assets/audio/